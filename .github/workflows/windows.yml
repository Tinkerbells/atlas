name: Windows Build

on:
  push:
    branches: [main]
    paths: &paths
      - 'apps/vue-desktop/**'
      - 'packages/**'
      - 'electron-builder.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile
        run: npm run compile -- --win -p never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-windows
          path: dist/Atlas*.exe
