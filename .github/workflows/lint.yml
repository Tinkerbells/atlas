name: Lint

on:
  push:
    branches: [main]
    paths: &paths
      - 'apps/shell/**'
      - 'packages/**'
      - 'electron-builder.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm -ws run --if-present typecheck
